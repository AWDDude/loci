version: "3"

set: [errexit, nounset, pipefail]

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # Release targets, matching what engRam publishes. windows/arm64 is left out
  # as it is there.
  PLATFORMS: darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64
  TAP_REPO: AWDDude/homebrew-tap

tasks:
  build:
    desc: Build a static binary at ./loci
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags "-s -w -X main.version={{.VERSION}}" -o loci ./cmd/loci

  test:
    desc: Run all tests with the race detector
    cmds:
      - go test -race ./...

  dist:
    desc: "Cross-compile release archives and checksums into dist/ (TAG=vX.Y.Z)"
    requires:
      vars: [TAG]
    vars:
      RELEASE_VERSION: '{{trimPrefix "v" .TAG}}'
    cmds:
      - rm -rf dist && mkdir -p dist
      - for: { var: PLATFORMS, split: " " }
        cmd: |
          os={{index (splitList "/" .ITEM) 0}}
          arch={{index (splitList "/" .ITEM) 1}}
          name=loci_${os}_${arch}
          exe=loci
          if [ "$os" = windows ]; then exe=loci.exe; fi
          mkdir -p "dist/$name"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
            -ldflags "-s -w -X main.version={{.RELEASE_VERSION}}" \
            -o "dist/$name/$exe" ./cmd/loci
          cp LICENSE README.md "dist/$name/"
          if [ "$os" = windows ]; then
            (cd "dist/$name" && zip -q "../$name.zip" "$exe" LICENSE README.md)
          else
            tar -czf "dist/$name.tar.gz" -C "dist/$name" "$exe" LICENSE README.md
          fi
          rm -rf "dist/$name"
      - cd dist && shasum -a 256 *.tar.gz *.zip > checksums.txt

  formula:
    desc: "Write the Homebrew formula for a built dist/ to dist/loci.rb (TAG=vX.Y.Z)"
    requires:
      vars: [TAG]
    vars:
      RELEASE_VERSION: '{{trimPrefix "v" .TAG}}'
      BASE_URL: "https://github.com/AWDDude/loci/releases/download/{{.TAG}}"
    cmds:
      - |
        sha() {
          sum=$(awk -v f="$1" '$2 == f { print $1 }' dist/checksums.txt)
          if [ -z "$sum" ]; then echo "no checksum for $1 in dist/checksums.txt" >&2; exit 1; fi
          echo "$sum"
        }
        darwin_arm64=$(sha loci_darwin_arm64.tar.gz)
        darwin_amd64=$(sha loci_darwin_amd64.tar.gz)
        linux_arm64=$(sha loci_linux_arm64.tar.gz)
        linux_amd64=$(sha loci_linux_amd64.tar.gz)
        cat > dist/loci.rb <<EOF
        # typed: strict
        # frozen_string_literal: true

        # Generated by \`task formula\` in github.com/AWDDude/loci. Do not edit.
        class Loci < Formula
          desc "Entity-oriented persistent memory MCP server for coding agents"
          homepage "https://github.com/AWDDude/loci"
          version "{{.RELEASE_VERSION}}"
          license "MIT"

          on_macos do
            on_arm do
              url "{{.BASE_URL}}/loci_darwin_arm64.tar.gz"
              sha256 "$darwin_arm64"
            end
            on_intel do
              url "{{.BASE_URL}}/loci_darwin_amd64.tar.gz"
              sha256 "$darwin_amd64"
            end
          end

          on_linux do
            on_arm do
              url "{{.BASE_URL}}/loci_linux_arm64.tar.gz"
              sha256 "$linux_arm64"
            end
            on_intel do
              url "{{.BASE_URL}}/loci_linux_amd64.tar.gz"
              sha256 "$linux_amd64"
            end
          end

          def install
            bin.install "loci"
          end

          test do
            assert_match version.to_s, shell_output("#{bin}/loci version")
          end
        end
        EOF

  check-tag:
    desc: "Refuse a tag that is not vX.Y.Z or not on origin/main (TAG=vX.Y.Z)"
    internal: true
    requires:
      vars: [TAG]
    cmds:
      - |
        if ! echo "{{.TAG}}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "tag {{.TAG}} is not of the form vX.Y.Z" >&2
          exit 1
        fi
        # Releases are cut from main only. This runs before anything is
        # published, so a tag on a feature branch fails without creating a
        # release or touching the tap.
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        commit=$(git rev-list -n 1 "{{.TAG}}")
        if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
          echo "tag {{.TAG}} points at $commit, which is not on main." >&2
          echo "Delete it (git push --delete origin {{.TAG}}), then tag a commit on main." >&2
          exit 1
        fi

  release:
    desc: "Publish a GitHub release and update the Homebrew tap. Run by CI on a pushed tag (TAG=vX.Y.Z)"
    requires:
      vars: [TAG]
    preconditions:
      - sh: '[ -n "${GH_TOKEN:-}" ]'
        msg: "GH_TOKEN must be set to a token that can create releases in AWDDude/loci"
      - sh: '[ -n "${TAP_GITHUB_TOKEN:-}" ]'
        msg: "TAP_GITHUB_TOKEN must be set to a token that can push to {{.TAP_REPO}}"
    cmds:
      - task: check-tag
        vars: { TAG: "{{.TAG}}" }
      - task: test
      - task: dist
        vars: { TAG: "{{.TAG}}" }
      - task: formula
        vars: { TAG: "{{.TAG}}" }
      # Notes list the commits since the previous tag, leaving out docs, test
      # and chore commits as engRam's changelog does.
      - |
        prev=$(git describe --tags --abbrev=0 "{{.TAG}}^" 2>/dev/null || true)
        range="{{.TAG}}"
        if [ -n "$prev" ]; then range="$prev..{{.TAG}}"; fi
        git log --no-merges --reverse --pretty='- %s (%h)' "$range" \
          | { grep -Ev '^- (docs|test|chore)(\(.*\))?!?:' || true; } > dist/notes.md
      - gh release create "{{.TAG}}" --verify-tag --title "{{.TAG}}" --notes-file dist/notes.md
          dist/*.tar.gz dist/*.zip dist/checksums.txt
      # Contents API rather than a clone: one authenticated call, and the sha
      # of the existing file (if any) makes it an update instead of a conflict.
      - |
        path=Formula/loci.rb
        sha=$(GH_TOKEN="$TAP_GITHUB_TOKEN" gh api "repos/{{.TAP_REPO}}/contents/$path" --jq .sha 2>/dev/null || true)
        set -- -f message="loci {{.TAG}}" -f content="$(base64 < dist/loci.rb | tr -d '\n')"
        if [ -n "$sha" ]; then set -- "$@" -f sha="$sha"; fi
        GH_TOKEN="$TAP_GITHUB_TOKEN" gh api -X PUT "repos/{{.TAP_REPO}}/contents/$path" "$@" --jq .commit.html_url
